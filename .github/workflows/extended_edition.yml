name: Extended Edition Foundation

on:
  pull_request:
    branches: [ master, extended-edition ]
  push:
    branches: [ master, extended-edition ]

permissions:
  contents: read

jobs:
  asset-guard:
    name: Tracked asset guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Reject original game data
      run: bash script/tools/check_tracked_assets.sh

  synthetic-renderer:
    name: Synthetic renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -y install libsdl2-dev libsdl2-mixer-dev ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_TESTS=ON
    - name: Build synthetic renderer tests
      run: cmake --build build --target synthetic_renderer_test
    - name: Run synthetic renderer tests
      run: ctest --test-dir build --output-on-failure

  sdl3-foundation:
    name: Linux SDL3 foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -y install \
          libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev ninja-build
    - name: Configure SDL3 foundation
      run: cmake -B build-sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_TESTS=ON -DUSE_SDL_VERSION=SDL3
    - name: Build game and synthetic tests
      run: cmake --build build-sdl3 --target fheroes2 synthetic_renderer_test sdl3_foundation_test
    - name: Run synthetic and SDL3 configuration tests
      run: ctest --test-dir build-sdl3 --output-on-failure
