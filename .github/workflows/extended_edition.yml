name: Extended Edition Foundation

on:
  pull_request:
    branches: [ master, extended-edition, "agent/**" ]
  push:
    branches: [ master, extended-edition ]

permissions:
  contents: read

jobs:
  asset-guard:
    name: Tracked asset guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Reject original game data
      run: bash script/tools/check_tracked_assets.sh

  synthetic-renderer:
    name: Synthetic renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -y install libsdl2-dev libsdl2-mixer-dev ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_TESTS=ON
    - name: Build data-free tests
      run: cmake --build build --target synthetic_renderer_test rgba_frame_test map_object_import_lookup_test map_format_import_validation_test map_format_import_metadata_roundtrip_test custom_monster_registry_test hero_specialty_test
    - name: Run data-free tests
      run: ctest --test-dir build --output-on-failure

  sdl3-foundation:
    name: Linux SDL3 (RGBA ${{ matrix.rgba }})
    strategy:
      matrix:
        rgba: ["OFF", "ON"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -y install \
          libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev ninja-build
    - name: Configure native SDL3 platform
      run: cmake -B build-sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_TESTS=ON -DUSE_SDL_VERSION=SDL3 -DENABLE_RGBA_RENDERER=${{ matrix.rgba }}
    - name: Build game and data-free tests
      run: cmake --build build-sdl3 --target fheroes2 synthetic_renderer_test rgba_frame_test map_object_import_lookup_test map_format_import_validation_test map_format_import_metadata_roundtrip_test custom_monster_registry_test hero_specialty_test sdl3_foundation_test sdl3_audio_test
    - name: Build physical RGBA presentation test
      if: matrix.rgba == 'ON'
      run: cmake --build build-sdl3 --target sdl3_rgba_test
    - name: Run synthetic and native SDL3 tests
      run: ctest --test-dir build-sdl3 --output-on-failure

  android-sdl3:
    name: Android SDL3 (RGBA ${{ matrix.rgba }})
    strategy:
      matrix:
        rgba: ["false", "true"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Install native build tools
      run: sdkmanager "ndk;28.2.13676358" "cmake;3.30.5"
    - name: Prepare pinned SDL3 sources
      run: python3 script/android/prepare_sdl3.py
    - name: Build SDL3 debug APK and bundle
      working-directory: android
      run: ./gradlew -PuseSDL3=true -PandroidAbis=arm64-v8a,x86_64 -PenableRGBA=${{ matrix.rgba }} assembleDebug bundleDebug app:lintDebug
    - name: Verify native libraries and generated asset packaging
      run: python3 script/android/check_sdl3_apk.py android/app/build/outputs/apk/debug/app-debug.apk arm64-v8a x86_64
    - name: Check generated assets stay outside the source tree
      run: test ! -e android/app/src/main/assets
