pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'fheroes2'

include ':app', ':isotools'
if (providers.gradleProperty('useSDL3').orElse('false').get().toBoolean()) {
    include ':sdl3'
} else {
    include ':sdl2'
}
