import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def useSDL3 = providers.gradleProperty('useSDL3').orElse('false').get().toBoolean()
def sdl3Source = providers.gradleProperty('sdl3Source').orElse("${rootDir}/build/sdl3-deps/SDL").get()
def sdl3MixerSource = providers.gradleProperty('sdl3MixerSource').orElse("${rootDir}/build/sdl3-deps/SDL_mixer").get()
def generatedAssets = layout.buildDirectory.dir('generated/gameAssets')
def generatedDigest = layout.buildDirectory.dir('generated/gameAssetDigest')

android {
    namespace 'org.fheroes2'

    compileSdk 35
    if (useSDL3) {
        ndkVersion '28.2.13676358'
    }

    defaultConfig {
        applicationId 'org.fheroes2'

        minSdk 22
        targetSdk 35

        // These paths are set relative to the android project directory
        versionCode((new File('../version_code.txt')).getText('UTF-8').trim().toInteger())
        versionName((new File('../version.txt')).getText('UTF-8').trim())

        externalNativeBuild {
            if (useSDL3) {
                cmake {
                    arguments '-DUSE_SDL_VERSION=SDL3', '-DANDROID_STL=c++_shared',
                            '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                            "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdl3Source}",
                            "-DFETCHCONTENT_SOURCE_DIR_SDL3_MIXER=${sdl3MixerSource}"
                    targets 'fheroes2'
                }
            } else {
                ndkBuild {
                    arguments '-j4'
                }
            }
        }
        ndk {
            abiFilters.addAll(providers.gradleProperty('androidAbis')
                    .orElse('armeabi-v7a,arm64-v8a,x86,x86_64').get().split(','))
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        if (useSDL3) {
            cmake {
                path '../../CMakeLists.txt'
                version '3.30.5'
            }
        } else {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }

    sourceSets {
        main {
            assets.setSrcDirs([generatedAssets, generatedDigest])
        }
    }

    signingConfigs {
        release {
            storeFile({
                def keystorePath = System.getenv('FHEROES2_KEYSTORE')

                return keystorePath ? file(keystorePath) : null
            }.call())

            storePassword({
                def keystorePass = System.getenv('FHEROES2_KEYSTORE_PASSWORD')

                return keystorePass ? keystorePass : ''
            }.call())

            keyAlias({
                def keyAlias = System.getenv('FHEROES2_KEY_ALIAS')

                return keyAlias ? keyAlias : ''
            }.call())

            keyPassword({
                def keyPass = System.getenv('FHEROES2_KEY_PASSWORD')

                return keyPass ? keyPass : ''
            }.call())
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                if (useSDL3) {
                    cmake {
                        arguments '-DCMAKE_COMPILE_WARNING_AS_ERROR=ON'
                    }
                } else {
                    ndkBuild {
                        cFlags '-DWITH_DEBUG', '-Werror'
                    }
                }
            }
        }

        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    implementation project(':isotools')
    if (useSDL3) {
        implementation project(':sdl3')
    } else {
        implementation project(':sdl2')
    }

    implementation group: 'commons-io', name: 'commons-io', version: '2.20.0'

    implementation 'org.tukaani:xz:1.10'

    implementation 'com.google.android.material:material:1.13.0'
}

tasks.register('stageGameAssets', Sync) {
    from('../../maps') {
        include '*.fh2m'
        into 'maps'
    }
    from('../../files/data') {
        include '*.h2d'
        into 'files/data'
    }
    from('../../files/timidity') {
        include 'instruments/*.pat'
        include 'timidity.cfg'
        into 'files/timidity'
    }
    from('../../files/lang') {
        include '*.mo'
        into 'files/lang'
    }
    into generatedAssets
}

tasks.register('generateAssetsDigest') {
    dependsOn stageGameAssets
    inputs.dir generatedAssets
    outputs.file generatedDigest.map { it.file('assets.digest') }

    doLast {
        final java.nio.file.Path assetsDirPath = generatedAssets.get().asFile.toPath()
        final java.nio.file.Path digestPath = generatedDigest.get().file('assets.digest').asFile.toPath()
        Files.createDirectories(digestPath.parent)

        final StringBuilder sb = new StringBuilder()

        fileTree(dir: assetsDirPath).sort { a, b ->
            assetsDirPath.relativize(a.toPath()).toString() <=> assetsDirPath.relativize(b.toPath()).toString()
        }.each {
            final java.nio.file.Path itPath = it.toPath()

            final byte[] itBuf = Files.readAllBytes(itPath)

            sb.append(String.format('%0128x % 12d %s\n',
                    new BigInteger(1, MessageDigest.getInstance('SHA-512').digest(itBuf)),
                    itBuf.length, assetsDirPath.relativize(itPath).toString().replace(File.separator, '/')))
        }

        Files.write(digestPath, sb.toString().getBytes('UTF-8'))
    }
}

preBuild {
    dependsOn generateAssetsDigest
}
